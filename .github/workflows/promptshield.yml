name: PromptShield

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run PromptShield
        id: promptshield
        uses: Zero-Harm-AI-LLC/promptshield@v1
        with:
          base-ref: origin/${{ github.base_ref || 'main' }}
          output-format: github
          output-file: ${{ runner.temp }}/promptshield-findings.json
          fail-on: any
          max-findings: 25

      - name: Upload PromptShield findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptshield-findings
          path: ${{ steps.promptshield.outputs.findings-path }}
